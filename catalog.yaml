version: 1

repository:
  name: codex-development-standards
  url: https://github.com/DanilFaritovich/codex-development-standards

selection:
  instructions: >
    Read this catalog first. Select only skills relevant to the target project
    and requested task. Do not load every skill by default.

sync:
  skill: standards-sync
  lock_file: .codex-standards.lock.yaml
  strategy: compare-locked-ref-and-fetch-changed-skills

skills:
  task-development-workflow:
    path: .agents/skills/task-development-workflow/SKILL.md
    tags: [workflow, development, git, pull-request, release, token-efficiency]
    description: Task checkpoints, safe branch/PR delivery, independent validation evidence and optional versioned releases.

  standards-sync:
    path: .agents/skills/standards-sync/SKILL.md
    tags: [workflow, standards, sync, lock, token-efficiency]
    description: Incrementally synchronize installed standards by comparing the locked upstream ref and fetching only changed skills.

  backend-clean-architecture:
    path: .agents/skills/backend-clean-architecture/SKILL.md
    tags: [backend, architecture, clean-architecture, ports, adapters, services]
    description: Layered clean backend architecture with ports and adapters.

  python-testing:
    path: .agents/skills/python-testing/SKILL.md
    tags: [python, testing, pytest, unit, integration, e2e]
    description: Python testing structure, naming, fixtures, and execution conventions.

  code-quality:
    path: .agents/skills/code-quality/SKILL.md
    tags: [quality, formatting, lint, types, autofix, makefile, python, frontend]
    description: Run safe backend/frontend auto-fixes before read-only lint, format, type, and test validation.

  fastapi:
    path: .agents/skills/fastapi/SKILL.md
    tags: [python, backend, fastapi, http, pydantic, dependency-injection]
    description: FastAPI presentation-boundary and dependency-wiring conventions.

  api-guardrails:
    path: .agents/skills/api-guardrails/SKILL.md
    tags: [api, fastapi, rate-limit, quota, redis, nginx, validation, security, limits]
    description: Two-layer HTTP anti-flood and application quota architecture, plus request/input resource guardrails.

  structured-logging:
    path: .agents/skills/structured-logging/SKILL.md
    tags: [logging, json, observability, loki, grafana, correlation-id]
    description: Structured JSON logging and Loki/Grafana-compatible observability conventions.

  sqlalchemy-alembic:
    path: .agents/skills/sqlalchemy-alembic/SKILL.md
    tags: [python, database, sqlalchemy, alembic, postgres, sqlite]
    description: SQLAlchemy persistence and Alembic migration conventions.

  vue:
    path: .agents/skills/vue/SKILL.md
    tags: [frontend, vue, typescript, api]
    description: Vue frontend boundaries, state ownership, and backend integration.

  vue-testing:
    path: .agents/skills/vue-testing/SKILL.md
    tags: [frontend, vue, testing, vitest, e2e]
    description: Vue unit, component, integration, and E2E testing conventions.

  design-to-vue:
    path: .agents/skills/design-to-vue/SKILL.md
    tags: [frontend, vue, figma, svg, responsive, design, accessibility, localization, token-efficiency]
    description: Translate local Figma/SVG/PNG design references into responsive Vue interfaces with targeted visual QA.

  seo:
    path: .agents/skills/seo/SKILL.md
    tags: [seo, discoverability, multilingual, hreflang, canonical, sitemap, robots, prerender, structured-data]
    description: Framework-agnostic technical SEO for public sites, metadata, crawlable pages, language routes and release verification.

  pdf-documents:
    path: .agents/skills/pdf-documents/SKILL.md
    tags: [pdf, documents, resume, localization, typography, links, validation]
    description: Create and validate professional, role-targeted and multilingual selectable PDF documents with real clickable links.

  pdfjs-viewer:
    path: .agents/skills/pdfjs-viewer/SKILL.md
    tags: [pdf, pdfjs, vue, viewer, annotation-layer, accessibility, responsive, testing]
    description: Secure PDF.js previews, safe URL annotations, lazy workers, responsive sizing, and deterministic interaction tests.

  website-qa:
    path: .agents/skills/website-qa/SKILL.md
    tags: [qa, website, playwright, visual, responsive, localization, accessibility, seo, testing]
    description: Browser-based functional and visual QA, multilingual viewport matrices, accessible interactions and owner acceptance.

  caddy-gateway:
    path: .agents/skills/caddy-gateway/SKILL.md
    tags: [caddy, gateway, reverse-proxy, https, tls, docker, routing, reload]
    description: Shared Caddy HTTPS gateway, deterministic route generation, safe reloads, upstream isolation and live-TLS verification boundaries.

  gitops-deployment:
    path: .agents/skills/gitops-deployment/SKILL.md
    tags: [gitops, deployment, controller, registry, reconcile, ghcr, digest, health, rollback]
    description: Declarative Docker service registration, immutable GHCR image rollout, health-gated reconciliation and recovery for a single VPS.

  docker:
    path: .agents/skills/docker/SKILL.md
    tags: [docker, compose, deployment, networking, health, nginx, redis, build-cache, least-privilege, security]
    description: Docker packaging, cache-friendly dependency layers, least-privilege runtime, networking, health, and startup conventions.

  ansible:
    path: .agents/skills/ansible/SKILL.md
    tags: [ansible, infrastructure-as-code, linux, provisioning, ssh, firewall, e2e, vm, recovery, token-efficiency]
    description: Idempotent Linux provisioning, staged initialization, VM E2E, safe SSH access and independent verification.

  github-actions:
    path: .agents/skills/github-actions/SKILL.md
    tags: [ci, github, github-actions, pull-request]
    description: GitHub Actions CI conventions and local/remote validation split.

  continuous-delivery:
    path: .agents/skills/continuous-delivery/SKILL.md
    tags: [cd, deployment, github-actions, ghcr, docker-compose, production, secrets]
    description: Production delivery using immutable images, GitHub Environment configuration, server-side runtime env, migrations, health checks, and rollback.

  documentation:
    path: .agents/skills/documentation/SKILL.md
    tags: [documentation, readme, audience, portfolio, agents, architecture, english, russian]
    description: Compact audience-aware READMEs, website and technology presentation, documentation timing, language modes and architecture updates.

  licensing:
    path: .agents/skills/licensing/SKILL.md
    tags: [license, mit, proprietary]
    description: License selection and preservation rules.

profiles:
  vue-static-site:
    path: profiles/vue-static-site.yaml
    tags: [vue, typescript, vite, static-site, frontend, i18n, seo, design-to-vue, github-actions]
    description: >
      Vue sites deployed as static assets: landing pages, portfolios, documentation
      and interactive content sites, with targeted checks and optional Docker/CD.

  fastapi-vue-clean:
    path: profiles/fastapi-vue-clean.yaml
    tags:
      - python
      - fastapi
      - vue
      - sqlalchemy
      - alembic
      - docker
      - github-actions
      - continuous-delivery
      - clean-architecture
      - logging
      - api-guardrails
    description: >
      Full-stack FastAPI + Vue profile with clean backend architecture,
      testing, persistence, API guardrails, structured logging, Docker, CI, documentation, and licensing.

  docker-deployment-platform:
    path: profiles/docker-deployment-platform.yaml
    tags: [deployment, gitops, caddy, docker, ghcr, reverse-proxy, single-vps, github-actions]
    description: >
      A central single-VPS Docker Compose deployment platform with a shared Caddy
      gateway, service registry, verified image digests, offline CI and gated rollouts.

  ansible-infrastructure:
    path: profiles/ansible-infrastructure.yaml
    tags: [ansible, infrastructure-as-code, linux, provisioning, github-actions]
    description: >
      Linux host provisioning with Ansible, safe access management, offline CI,
      and optional Docker/CD integration.
