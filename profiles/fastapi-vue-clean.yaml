name: fastapi-vue-clean
version: 4

description: >
  Full-stack profile for a Python FastAPI backend using layered clean
  architecture, ports and adapters, SQLAlchemy/Alembic persistence,
  a Vue frontend, API guardrails, structured JSON logging, Docker packaging,
  GitHub Actions CI, documentation, and explicit licensing rules.

skills:
  - task-development-workflow
  - backend-clean-architecture
  - python-testing
  - code-quality
  - fastapi
  - api-guardrails
  - structured-logging
  - sqlalchemy-alembic
  - vue
  - vue-testing
  - docker
  - github-actions
  - documentation
  - licensing

optional_skills:
  - continuous-delivery

defaults:
  development_branch: develop
  stable_branch: main
  backend:
    language: python
    framework: fastapi
    architecture: clean-layered
    persistence: sqlalchemy
    migrations: alembic
  frontend:
    framework: vue
    backend_is_source_of_truth: true
  logging:
    format: json
    centralized: true
    loki_compatible: true
  api:
    rate_limiting: true
    edge_http_rate_limit: true
    edge_scope: /api/
    edge_identity: client_ip
    edge_burst: true
    bounded_input: true
    configurable_limits: true
    expensive_operation_quota:
      layer: application
      shared_store: redis
      algorithm: sliding-window
      atomic_consume: true
  infrastructure:
    redis:
      enabled_for_shared_quota: true
      healthcheck: true
    reverse_proxy:
      api_anti_flood: true
      preferred_when_present: nginx
  ci:
    provider: github-actions
    local_full_ci: false
  cd:
    enabled_by_default: false
    skill: continuous-delivery
  documentation:
    languages:
      - en
      - ru

adaptation:
  preserve_existing_architecture_when_compatible: true
  do_not_add_unused_technologies: true
  do_not_overwrite_existing_license: true
  require_project_specific_agents_md: true
  require_architecture_md_when_architecture_is_nontrivial: true
