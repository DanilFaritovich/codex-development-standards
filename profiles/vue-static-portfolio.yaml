name: vue-static-portfolio
version: 1

description: >
  Static, content-driven portfolio and project directory built with Vue 3,
  TypeScript, Vite and optional Vue I18n/PDF viewing. No backend, database,
  business API, migrations or centralized state by default.

skills:
  - task-development-workflow
  - standards-sync
  - code-quality
  - vue
  - vue-testing
  - design-to-vue
  - github-actions
  - documentation

optional_skills:
  - docker
  - continuous-delivery
  - licensing

defaults:
  standards_sync:
    lock_file: .codex-standards.lock.yaml
    incremental: true
  branches:
    integration: develop
    stable: main
    task_base: develop
  frontend:
    framework: vue
    language: typescript
    build: vite
    content: git-tracked
    no_backend_by_default: true
    localization: vue-i18n-when-needed
    validation:
      - eslint
      - prettier
      - vue-tsc
      - vitest
      - playwright-for-critical-flows
  design:
    local_references: design/reference/
    guidelines: design/DESIGN.md
    visual_qa: browser-screenshots
  checks:
    local: "make fix -> targeted checks -> make check"
    extended: make verify
    ci: make ci
  remote_delivery:
    policy: project-specific-standing-authorization-only
    tool: gh
    approved_flow: "local commit -> push task branch -> PR to develop -> stop before merge"

adaptation:
  install_only_applicable_skills: true
  install_optional_skills_only_for_active_work: true
  preserve_project_specific_instructions: true
  do_not_add_backend_databases_or_global_store_without_requirement: true
  create_architecture_md_only_when_requested: true
  create_project_specific_agents_md_during_explicit_bootstrap: true
  do_not_treat_figma_mcp_as_required_for_local_svg_reference: true
